<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gonzalo Battro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #FAF6F1;
      --cream-dark: #F0EAE2;
      --terracotta: #C0704E;
      --terracotta-hover: #A85D3E;
      --text-primary: #2C2C2C;
      --text-secondary: #6B6560;
      --card-bg: #FFFFFF;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.06);
      --card-shadow-hover: 0 6px 20px rgba(0,0,0,0.1);
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--cream);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1.25rem 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }

    /* --- Avatar --- */
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background-color: var(--terracotta);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      animation: fadeSlideIn 0.6s ease both;
    }

    /* --- Header --- */
    .header {
      text-align: center;
      animation: fadeSlideIn 0.6s ease 0.1s both;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    /* --- Links --- */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      width: 100%;
      padding: 0.9rem 1.15rem;
      background: var(--card-bg);
      border: 1px solid rgba(0,0,0,0.04);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      text-decoration: none;
      color: var(--text-primary);
      font-size: 0.9375rem;
      font-weight: 500;
      transition: box-shadow 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
      opacity: 0;
      animation: fadeSlideIn 0.5s ease both;
    }

    .link-card:nth-child(1) { animation-delay: 0.2s; }
    .link-card:nth-child(2) { animation-delay: 0.3s; }
    .link-card:nth-child(3) { animation-delay: 0.4s; }
    .link-card:nth-child(4) { animation-delay: 0.5s; }
    .link-card:nth-child(5) { animation-delay: 0.6s; }

    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--card-shadow-hover);
      border-color: var(--terracotta);
    }

    .link-card:hover .icon-wrap {
      background-color: var(--terracotta);
    }

    .link-card:hover .icon-wrap svg {
      stroke: #fff;
    }

    .icon-wrap {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background-color: var(--cream-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.25s ease;
    }

    .icon-wrap svg {
      width: 18px;
      height: 18px;
      stroke: var(--terracotta);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.25s ease;
    }

    .link-label {
      flex: 1;
    }

    .link-arrow {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.4;
      transition: opacity 0.25s ease;
    }

    .link-card:hover .link-arrow {
      opacity: 0.7;
    }

    /* --- Footer --- */
    .footer {
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0;
      animation: fadeSlideIn 0.5s ease 0.75s both;
    }

    /* --- Animation --- */
    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

    </nav>

    <p class="footer">Built by Gonzalo</p>

  </div>
</body>
